$kind: http-request
url: "{{baseUrl}}/api/events?page=1&limit=10&category=technology&sort=start_asc"
method: GET
queryParams:
  page: "1"
  limit: "10"
  category: technology
  sort: start_asc
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Pagination and event list present", function () {
          var json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data).to.have.property("events");
          pm.expect(json.data).to.have.property("pagination");
      });
    language: text/javascript
order: 1000
