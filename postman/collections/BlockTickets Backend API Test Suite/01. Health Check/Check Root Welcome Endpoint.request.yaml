$kind: http-request
url: "{{baseUrl}}/"
method: GET
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200", function () {
          pm.response.to.have.status(200);
      });
      pm.test("Message confirms Aiven MySQL connection", function () {
          var json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.message).to.include("Aiven Cloud MySQL");
      });
    language: text/javascript
order: 2000
