$kind: http-request
url: "{{baseUrl}}/api/auth/register"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "email": "{{customerEmail}}",
      "password": "Customer@123",
      "fullName": "Nguyen Tuan An",
      "role": "customer"
    }
scripts:
  - type: beforeRequest
    code: |-
      var randomSuffix = Math.floor(Math.random() * 10000);
      pm.environment.set("customerEmail", "customer_" + randomSuffix + "@gmail.com");
    language: text/javascript
  - type: afterResponse
    code: |-
      pm.test("Status code is 201 Created", function () {
          pm.response.to.have.status(201);
      });
      pm.test("User registered with role customer", function () {
          var json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data.user.role).to.eql("customer");
          pm.environment.set("customerToken", json.data.accessToken);
          pm.environment.set("customerRefreshToken", json.data.refreshToken);
      });
    language: text/javascript
order: 2000
