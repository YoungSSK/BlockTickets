$kind: http-request
url: "{{baseUrl}}/api/auth/refresh-token"
method: POST
headers:
  Content-Type: application/json
body:
  type: text
  content: |-
    {
      "refreshToken": "{{organizerRefreshToken}}"
    }
scripts:
  - type: afterResponse
    code: |-
      pm.test("Status code is 200 OK", function () {
          pm.response.to.have.status(200);
      });
      pm.test("New accessToken received", function () {
          var json = pm.response.json();
          pm.expect(json.success).to.eql(true);
          pm.expect(json.data).to.have.property("accessToken");
          pm.environment.set("organizerToken", json.data.accessToken);
      });
    language: text/javascript
order: 7000
